<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3a6ea5" />
    <meta
      name="description"
      content="A working Windows Millennium Edition desktop, recreated for the browser with a persistent filesystem, classic applications, games, and WebGPU rendering."
    />
    <title>Windows Millennium Edition</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23000' d='M4 6h24v20H4z'/%3E%3Cpath fill='%23f44' d='M7 8h8v7H7z'/%3E%3Cpath fill='%234b4' d='M17 8h8v7h-8z'/%3E%3Cpath fill='%234af' d='M7 17h8v7H7z'/%3E%3Cpath fill='%23fd3' d='M17 17h8v7h-8z'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./packages/ui/src/classic.css" />
    <link rel="stylesheet" href="./desktop.css" />
  </head>
  <body>
    <main id="desktop" aria-label="Windows Millennium Edition desktop">
      <canvas id="desktop-surface" aria-hidden="true"></canvas>
      <div id="desktop-icons" aria-label="Desktop icons"></div>
      <div id="windows" aria-label="Open windows"></div>
      <div id="selection-box" hidden></div>
    </main>
    <footer id="taskbar" aria-label="Taskbar"></footer>
    <div id="menus"></div>
    <div id="overlays"></div>
    <div id="announcer" class="sr-only" aria-live="polite"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
